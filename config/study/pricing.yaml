# Published list rates used for the cost columns in analysis/.
# Sonnet rates are the confirmatory Spreadsheet / SWE cost card.
# Luna rates are the model-2 list card (different model; not pooled).

sonnet:
  model: claude-sonnet-4-5-20250929
  per_million_usd:
    input_tokens: "3.00"
    output_tokens: "15.00"
    cache_read_input_tokens: "0.30"
    cache_creation_input_tokens: "3.75"
  formula: "(input*3.00 + output*15.00 + cache_read*0.30 + cache_creation*3.75) / 1e6"

luna:
  model: gpt-5.6-luna
  per_million_usd:
    input_tokens: "0.20"
    output_tokens: "1.20"
    cache_read_input_tokens: "0.02"
    cache_creation_input_tokens: "0.20"
  formula: "(uncached_input*0.20 + cached_input*0.02 + output_incl_reasoning*1.20) / 1e6"
