[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delegation-feedback-study"
version = "0.1.0"
description = "Four-condition delegation and executable-feedback study"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.68",
  "openai>=1.80",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.9",
  "scipy>=1.14",
  "tenacity>=9.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
generate-synthetic = "delegation_study.analysis.generate_synthetic:main"
analyze-delegation  = "delegation_study.analysis.analyze:main"

[tool.hatch.build.targets.wheel]
packages = ["src/delegation_study"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: live Docker or confirmatory on-disk run directories",
]
